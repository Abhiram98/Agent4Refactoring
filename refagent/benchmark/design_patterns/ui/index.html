<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pattern Validator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Design Pattern Validator</h1>
            <div class="stats">
                <div class="stat-item">Unreviewed: <span id="remaining-count">0</span></div>
                <div class="stat-item">Reviewed: <span id="validated-count">0</span></div>
            </div>
        </header>

        <div class="controls">
            <input type="text" id="search" placeholder="Search patterns or classes...">
            <button class="btn btn-secondary" id="refresh-btn">Refresh List</button>
            <button class="btn btn-primary" id="update-btn">Update File (0)</button>
        </div>

        <div id="loading" class="loading">Fetching candidates...</div>
        <div id="candidate-list" class="candidate-list"></div>
    </div>

    <script src="app.js"></script>
</body>
</html>
