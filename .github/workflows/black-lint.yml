name: Black Code Formatter

on:
  push:
    branches: [ main, dev, test-ga  ]
  pull_request:
    branches: [ main, dev, test-ga ]

jobs:
  black-lint:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.9'
        
    - name: Install Black
      run: |
        python -m pip install --upgrade pip
        pip install black
        
    - name: Run Black check
      run: |
        black --check --diff --color .

